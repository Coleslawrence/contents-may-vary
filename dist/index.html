<meta name="description" content="A mimic idle game: lure visitors, swallow them, become what you eat.">

<meta name="mobile-web-app-capable" content="yes">

<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%;touch-action:manipulation}</style>
</head><body>
<style>
/* Layout: one phone column. Dungeon scene up top, big labelled controls below, a timers card for everything that counts down. Light and dark both supported; the scene itself is always torchlit. */
:root {
  --bg: #f6efe4; --bg2: #efe5d5; --card: #fffaf2; --card2: #f3e9d9; --line: #d9c9ae; --line2: #bfa983;
  --text: #241a12; --muted: #5d4c3c; --accent: #9b5d22; --accent-ink: #fffaf0; --accent-2: #7a4718;
  --good: #2f7a3b; --good-bg: #e2f2df; --bad: #b3261e; --bad-bg: #fbe3df; --warn: #8a5a00; --warn-bg: #fdf0cf;
  --hp: #2f8a43; --xp: #b8862a; --belly: #a8642a; --eye: #6e4a9e;
  --parch: #f4e7c8; --parch-ink: #3a2a18; --parch-line: #c9ad74;
  --scene: #241d2c; --scene-2: #1a1520; --scene-text: #f3ead9;
  --f-d: "Grenze", "Palatino Linotype", Georgia, serif; --f-b: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif; --f-m: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --fs: 17px;
  --t-beast: #c99a62; --t-humanoid: #e9c79c; --t-undead: #b9c2cc; --t-fiend: #ff6f52; --t-celestial: #ffe08a; --t-construct: #9db4c8; --t-dragon: #ff9f45; --t-fey: #d59cff; --t-elemental: #ff8a3d; --t-giant: #a98c74; --t-ooze: #9fd06e; --t-plant: #79c86a; --t-aberration: #c47de0; --t-monstrosity: #e0707f;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17131c; --bg2: #1e1925; --card: #262030; --card2: #2f283b; --line: #3d3450; --line2: #5a4f6e;
  --text: #f4ede2; --muted: #c4b8cf; --accent: #e0a54f; --accent-ink: #1c1206; --accent-2: #b97c2e;
  --good: #8fd88a; --good-bg: #1f3322; --bad: #ff8a7d; --bad-bg: #3a1f1d; --warn: #ffd06a; --warn-bg: #3a2f17;
  --hp: #7bd67f; --xp: #f0c15c; --belly: #e09a5c; --eye: #c3a2f0;
  --parch: #f1e4c4; --parch-ink: #2f2214; --parch-line: #b8a06b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17131c; --bg2: #1e1925; --card: #262030; --card2: #2f283b; --line: #3d3450; --line2: #5a4f6e;
  --text: #f4ede2; --muted: #c4b8cf; --accent: #e0a54f; --accent-ink: #1c1206; --accent-2: #b97c2e;
  --good: #8fd88a; --good-bg: #1f3322; --bad: #ff8a7d; --bad-bg: #3a1f1d; --warn: #ffd06a; --warn-bg: #3a2f17;
  --hp: #7bd67f; --xp: #f0c15c; --belly: #e09a5c; --eye: #c3a2f0;
  --parch: #f1e4c4; --parch-ink: #2f2214; --parch-line: #b8a06b; color-scheme: dark; }
:root.big { --fs: 20px; }
:root.big .stats { grid-template-columns: 1fr 1fr; }
:root.big .tiles { grid-template-columns: 1fr 1fr; }
html { font-size: var(--fs); }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.45 var(--f-b); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-family: var(--f-d); font-weight: 800; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { height: 100%; max-width: 540px; margin: 0 auto; display: grid; grid-template-rows: 1fr auto; }
@media (min-width: 580px) { #app { border-inline: 1px solid var(--line); } }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ic { width: 1.5em; height: 1.5em; flex: none; display: block; }
.ic.sm { width: 1.15em; height: 1.15em; }

/* header */
.hdr { padding-block: 10px 8px; background: var(--bg2); border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.hrow { display: flex; align-items: center; gap: 10px; }
.hrow .nm { font-family: var(--f-d); font-weight: 800; font-size: 1.35rem; line-height: 1; }
.hrow .tier { color: var(--muted); font-size: .85rem; }
.hrow .grow { flex: 1; min-width: 0; }
.iconbtn { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card); display: grid; place-items: center; cursor: pointer; }
.stats { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 6px; }
.stat { display: grid; gap: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; min-width: 0; }
.stat .t { display: flex; align-items: center; gap: 5px; font-size: .78rem; color: var(--muted); }
.stat b { font-size: .95rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 7px; border-radius: 4px; background: var(--card2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; transition: width .4s; }
.hpc { color: var(--hp); } .xpc { color: var(--xp); } .bec { color: var(--belly); } .eyc { color: var(--eye); }

/* scene */
main { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.scene { position: relative; flex: 0 0 auto; height: clamp(150px, 27vh, 230px); overflow: hidden; color: var(--scene-text);
  background: radial-gradient(240px 140px at 16% 28%, rgba(255,170,80,.18), transparent 70%), linear-gradient(180deg, transparent 74%, rgba(0,0,0,.35) 74%), repeating-linear-gradient(0deg, transparent 0 25px, rgba(0,0,0,.26) 25px 27px), repeating-linear-gradient(90deg, transparent 0 46px, rgba(0,0,0,.16) 46px 48px), linear-gradient(180deg, var(--scene), var(--scene-2)); }
.scene .where { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 10px; font-family: var(--f-d); font-size: 1.05rem; text-shadow: 0 1px 0 #000; }
.scene .where small { display: block; font-family: var(--f-b); font-size: .78rem; opacity: .85; }
.torch { position: absolute; left: 15%; top: 18%; width: 10px; height: 22px; border-radius: 50% 50% 40% 40%; background: radial-gradient(circle at 50% 70%, #fff3b0, #ffad3b 45%, rgba(255,90,20,0) 75%); animation: flick 2.2s infinite ease-in-out; }
@keyframes flick { 30% { transform: scale(.92,1.06); } 60% { transform: scale(1.05,.95); } }
.mimic { position: absolute; left: 66%; bottom: 6%; height: 64%; aspect-ratio: 200 / 170; max-width: 46%; transform: translateX(-50%); }
.mimic svg { height: 100%; }
.scene.enc .mimic { left: 34%; }
.mimic svg { display: block; width: 100%; height: auto; overflow: visible; transform-origin: 50% 100%; }
.mimic.idle svg { animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.012, 1.022); } }
.mimic .top { transition: transform .32s cubic-bezier(.2,1.6,.4,1); transform-box: view-box; }
.mimic.open .top { transform: translate(0, -24px) rotate(-5deg); }
.mimic.chomp .top { animation: chomp .42s ease-in-out; }
@keyframes chomp { 0% { transform: translate(0,-24px) rotate(-5deg); } 40% { transform: translate(0,-2px) rotate(0); } 100% { transform: translate(0,-24px) rotate(-5deg); } }
.mimic.full svg { animation: gulp .9s ease-in-out infinite; }
@keyframes gulp { 50% { transform: scale(1.05, .97); } }
.mimic.hurt svg { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px) rotate(-2deg); } 50% { transform: translateX(5px) rotate(1.5deg); } 80% { transform: translateX(-3px); } }
.mimic .eye { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
.mimic.hold .eye { transform: scaleY(.35); animation: none; }
.mimic .tongue { transform-box: fill-box; transform-origin: 50% 0; transition: transform .3s, opacity .2s; transform: scaleY(.2); opacity: 0; }
.mimic.open .tongue { transform: scaleY(1); opacity: 1; }
.mimic.lick .tongue { animation: lick .9s ease-in-out 2; }
@keyframes lick { 50% { transform: scaleY(1.25) rotate(8deg); } }
.tok { position: absolute; right: 11%; bottom: 10%; display: grid; justify-items: center; gap: 3px; animation: tin .5s cubic-bezier(.2,1.2,.4,1); }
.tok .disc { border-radius: 50%; display: grid; place-items: center; font-family: var(--f-d); font-weight: 800; color: #1b1206; background: radial-gradient(circle at 35% 30%, #fff8, transparent 60%), var(--tc); box-shadow: 0 5px 0 rgba(0,0,0,.35); }
.tok.sz-T .disc { width: 42px; height: 42px; font-size: 16px; } .tok.sz-S .disc { width: 54px; height: 54px; font-size: 19px; } .tok.sz-M .disc { width: 66px; height: 66px; font-size: 22px; } .tok.sz-L .disc { width: 84px; height: 84px; font-size: 27px; }
.tok .lab { font-size: .72rem; font-weight: 700; background: rgba(0,0,0,.6); color: #fff; padding: 1px 7px; border-radius: 8px; white-space: nowrap; }
.tok.stuck { right: 21%; } .tok.stuck .disc { animation: wobble .6s ease-in-out infinite; }
.tok.gone { animation: tout .5s forwards; } .tok.eaten { animation: teat .45s forwards; }
@keyframes tin { from { transform: translateX(120px); opacity: 0; } }
@keyframes tout { to { transform: translateX(160px); opacity: 0; } }
@keyframes teat { to { transform: translateX(-120px) scale(.1); opacity: 0; } }
@keyframes wobble { 50% { transform: rotate(-8deg); } }
.float { position: absolute; font-family: var(--f-d); font-weight: 800; font-size: 1.8rem; pointer-events: none; text-shadow: 0 2px 0 #000; animation: fl 1.1s forwards; }
.float.me { color: #ff8a7d; } .float.v { color: #ffd06a; }
@keyframes fl { to { transform: translateY(-44px); opacity: 0; } }
.qbadge { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 12px; font-size: .8rem; font-weight: 700; color: #1b1206; background: #f0c15c; border-radius: 12px; padding: 3px 10px; }

/* panel */
.panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; gap: 12px; align-content: start; padding-block: 12px 16px; }
.big-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 64px; padding: 10px 16px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; box-shadow: 0 4px 0 var(--accent-2); font-family: var(--f-d); font-weight: 800; font-size: 1.45rem; letter-spacing: .02em; }
.big-btn .ic { width: 1.4em; height: 1.4em; }
.big-btn small { display: block; font-family: var(--f-b); font-weight: 400; font-size: .8rem; letter-spacing: 0; opacity: .9; }
.big-btn:disabled { opacity: .5; cursor: not-allowed; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { display: grid; justify-items: center; align-content: center; gap: 4px; min-height: 84px; padding: 8px 4px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card); cursor: pointer; text-align: center; }
.tile b { font-size: .92rem; } .tile small { font-size: .72rem; color: var(--muted); line-height: 1.2; }
.tile:disabled { opacity: .5; cursor: not-allowed; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.card h3 { font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.timer { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; }
.timer .ic { color: var(--muted); }
.timer .lbl { font-size: .95rem; font-weight: 700; min-width: 0; }
.timer .lbl small { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); }
.timer .clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; background: var(--card2); border-radius: 8px; padding: 3px 9px; min-width: 4.6em; text-align: center; }
.timer .meter { grid-column: 2 / -1; }
.timer.warn .clock { background: var(--bad-bg); color: var(--bad); }
.sysbox { background: var(--parch); color: var(--parch-ink); border: 1px solid var(--parch-line); border-radius: 6px; padding: 9px 12px; font-family: var(--f-m); font-size: .88rem; line-height: 1.4; cursor: pointer; }
.sysbox.bad { background: #f6d7cc; }
.sysbox p + p { margin-top: 4px; }

/* encounter */
.vcard { display: grid; gap: 8px; }
.vhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.vhead h2 { font-size: 1.5rem; line-height: 1.05; }
.vhead .meta { color: var(--muted); font-size: .88rem; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .82rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; border: 1.5px solid currentColor; }
.d-easy { color: var(--good); background: var(--good-bg); } .d-fair { color: var(--warn); background: var(--warn-bg); } .d-hard, .d-deadly { color: var(--bad); background: var(--bad-bg); }
.hpline { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: .88rem; font-variant-numeric: tabular-nums; }
.hpline .meter { height: 10px; }
.odds { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.ring { width: 76px; height: 76px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.why { display: grid; gap: 3px; font-size: .88rem; margin: 0; padding: 0; list-style: none; }
.why li { display: flex; gap: 6px; align-items: flex-start; }
.why .ok { color: var(--good); } .why .no { color: var(--bad); }
.event { font-size: 1.05rem; font-weight: 700; min-height: 1.5em; }
.event.good { color: var(--good); } .event.bad { color: var(--bad); }
.roll { font-size: .85rem; color: var(--muted); }
.roll .y { color: var(--good); font-weight: 700; } .roll .n { color: var(--bad); font-weight: 700; } .roll .c { color: var(--warn); font-weight: 700; }
.recent { display: grid; gap: 2px; font-size: .85rem; color: var(--muted); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.act { position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 9px; align-items: center; text-align: left; min-height: 72px; padding: 10px 12px; border-radius: 14px; border: 1.5px solid var(--line2); background: var(--card); cursor: pointer; }
.act .ic { grid-row: 1 / 3; width: 1.7em; height: 1.7em; color: var(--accent); }
.act b { font-size: 1rem; line-height: 1.15; }
.act small { font-size: .78rem; color: var(--muted); line-height: 1.25; }
.act .chance { position: absolute; top: 6px; right: 8px; font-size: .78rem; font-weight: 700; color: var(--text); background: var(--card2); border-radius: 8px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.act.best { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); background: linear-gradient(180deg, var(--card), var(--card2)); }
.act.best::after { content: "Best move"; position: absolute; bottom: -9px; left: 12px; font-size: .68rem; font-weight: 700; background: var(--accent); color: var(--accent-ink); padding: 0 7px; border-radius: 6px; }
.act:disabled { opacity: .5; cursor: not-allowed; }
.act.wide { grid-column: 1 / -1; }
.act.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 4px 0 var(--accent-2); }
.act.go .ic, .act.go small { color: var(--accent-ink); }
.res h2 { font-size: 2rem; color: var(--accent); } .res h2.bad { color: var(--bad); }
.gains { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.gains li { display: flex; align-items: center; gap: 8px; font-size: 1rem; }
.dsv { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: .85rem; }
.dsv i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; border: 2px solid var(--line2); }
.dsv i.s { border-color: var(--good); color: var(--good); } .dsv i.f { border-color: var(--bad); color: var(--bad); } .dsv i.n20 { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* nav */
nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg2); border-top: 1px solid var(--line); }
nav.tabs button { background: none; border: 0; min-height: 60px; cursor: pointer; color: var(--muted); font-size: .8rem; font-weight: 700; display: grid; justify-items: center; align-content: center; gap: 2px; position: relative; }
nav.tabs button.on { color: var(--accent); }
nav.tabs button.on::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
nav.tabs .dot { position: absolute; top: 8px; right: calc(50% - 18px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: #fff; font-size: .68rem; display: grid; place-items: center; padding: 0 4px; }

/* views */
.view { overflow-y: auto; padding-block: 14px 20px; display: grid; gap: 14px; align-content: start; }
.view h2 { font-size: 1.6rem; }
.sub { font-size: .88rem; color: var(--muted); }
.warnbox { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: .92rem; }
.grid { display: grid; gap: 6px; padding: 10px; border-radius: 16px; background: radial-gradient(ellipse at 50% 40%, #5a1626, #3b0c19 75%); border: 2px solid #7a1f35; }
.cell { aspect-ratio: 1; border-radius: 10px; border: 1.5px dashed rgba(234,92,125,.3); background: rgba(0,0,0,.18); display: grid; place-items: center; align-content: center; gap: 2px; padding: 4px; text-align: center; color: #f4ede2; cursor: pointer; position: relative; min-width: 0; }
.cell.it { border: 2px solid var(--rc); background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(0,0,0,.15)), #2f283b; }
.cell .ic { width: 1.6em; height: 1.6em; color: var(--rc); }
.cell span { font-size: .66rem; line-height: 1.1; font-weight: 700; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.cell .flag { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); font-size: .58rem; font-weight: 700; padding: 0 5px; border-radius: 5px; background: #f0c15c; color: #1b1206; white-space: nowrap; }
.cell .flag.att { background: #c79bff; }
.cell .flag.cur { background: #ff8a7d; }
.r-common { --rc: #b9b2a3; } .r-uncommon { --rc: #7ddc87; } .r-rare { --rc: #7fb6ff; }
.list { display: grid; gap: 8px; }
.li { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: .92rem; }
.li .ic { color: var(--accent); }
.li b { display: block; }
.li.off { opacity: .5; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: .95rem; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.abil { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.abil div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; }
.abil small { font-size: .75rem; color: var(--muted); }
.abil b { font-family: var(--f-d); font-size: 1.6rem; line-height: 1; }
.erow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
.erow b { font-size: .92rem; } .erow small { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); }
.erow .n { font-size: .82rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.erow.on { border-color: var(--accent); } .erow.on .n { color: var(--accent); }

/* sheets */

const die = n => 1 + ri(n);
function parseExpr(e) { const m = String(e).match(/^(\d+)d(\d+)([+-]\d+)?$/); return m ? { n: +m[1], s: +m[2], b: +(m[3] || 0) } : { n: 0, s: 0, b: +e || 0 }; }
function roll(e, crit) { const p = parseExpr(e); let t = p.b; const n = crit ? p.n * 2 : p.n; for (let i = 0; i < n; i++) t += die(p.s); return Math.max(0, t); }
function avg(e) { const p = parseExpr(e); return p.n * (p.s + 1) / 2 + p.b; }
// mode: >0 advantage, <0 disadvantage
function d20(mode) { const a = die(20), b = die(20); if (mode > 0) return { r: Math.max(a, b), a, b, mode: 1 }; if (mode < 0) return { r: Math.min(a, b), a, b, mode: -1 }; return { r: a, a, mode: 0 }; }
const sgn = n => (n >= 0 ? '+' : '−') + Math.abs(n);

const mod = k => Math.floor((score(k) - 10) / 2);
const prof = () => profFor(S.lvl);

function bellyCap() { return 4 + 2 * Math.max(0, mod('CON')) + T().belly + (feat('glutton') ? 4 : 0) + 2 * dt('food') + [0, 2, 4][ess('giant')]; }

}
function saveBonus(k) { let b = mod(k) + dt('holy'); activeItems().forEach(c => b += ITEMS[c.id].saves || 0); return b; }

// ---------- Items: placing, fusing, digesting ----------
function firstEmpty() { return S.grid.findIndex(c => !c); }

}

// ---------- XP, levels, evolution ----------
function gainXp(n, msgs) {

  S.xp += Math.round(n);
  while (S.lvl < MAX_LVL && S.xp >= XP_AT[S.lvl + 1]) {
    const before = maxHp(); S.lvl++; S.hp += maxHp() - before;
    const txt = levelLine(S.lvl); msgs && msgs.push({ text: txt, cls: 'level' }); sys(txt, 'level');
    if (ASI_LVLS.includes(S.lvl)) S.pending.push('asi');
    if (S.lvl === 3 && S.tier === 'lesser') S.pending.push('evo_chest');
    if (S.lvl === 6 && S.tier === 'chest') S.pending.push('evo_branch');
    if (S.lvl === MAX_LVL) S.pending.push('max');

}
const LEVEL_LINES = ['', '', '[Level 2. You are now slightly more box.]', '[Level 3. Something is happening to your hinges.]', '[Level 4. You may improve yourself. Please improve your manners.]', '[Level 5. You have reached Level 5. Several adventurers who were trying to have not.]', '[Level 6. You are outgrowing the room.]', '[Level 7. The dungeon has started to notice you.]', '[Level 8. Improve yourself again. The System has given up on your manners.]', '[Level 9. There are fewer adventurers than there used to be. Correlation is not causation.]', '[Level 10. You have reached the end of this prototype. The System is relieved.]'];

  if (tier === 'wardrobe') ['wardrobe', 'coffin'].forEach(f => { if (!S.forms.includes(f)) S.forms.push(f); });
  if (tier === 'doorway' && !S.forms.includes('door')) S.forms.push('door');
  if (tier === 'chest' && !S.regions.includes('road')) S.regions.push('road');
  const txt = `[Evolution complete: ${TIERS[tier].name}. ${TIERS[tier].desc}]`;
  msgs && msgs.push({ text: txt, cls: 'level' }); sys(txt, 'level');
}

  else if (FEATS[choice] && !feat(choice)) { S.feats.push(choice); sys(`[Feat learned: ${FEATS[choice].name}. ${FEATS[choice].desc}]`, 'level'); }
}

// ---------- Visitors and encounters ----------

}

function timersList(now) {
  const since = (now - (S.lastTick || now)) / 60000; const out = [];
  if (S.digest) out.push({ id: 'digest', short: 'Digest', icon: 'gut', label: `Digesting ${ITEMS[S.digest.item.id].name}`, left: S.digest.left - since * 60000, total: S.digest.dur, sub: `Becomes: ${digestGain(S.digest.item.id)}` });
  const rate = feat('glutton') ? 22 : 15;
  if (S.belly > 0) { const next = Math.max(0, ((1 - S.bellyAcc) * rate - since) * 60000); out.push({ id: 'belly', short: 'Hungry', icon: 'belly', label: 'Belly goes down by 1', left: next, total: rate * 60000, sub: `Empty in ${fmtDur(next + (S.belly - 1) * rate * 60000)}` }); }
  else out.push({ id: 'belly', short: 'Starving', icon: 'belly', label: 'Starving', left: 0, total: 1, sub: 'You heal at half speed. Eat something.', warn: true });
  const mh = maxHp();

  if (S.naps < 3) { const left = Math.max(0, 20 * 60000 - (now - S.napAt)); out.push({ id: 'nap', short: 'Nap', icon: 'moon', label: `Next nap (${S.naps}/3 ready)`, left, total: 20 * 60000 }); }

}
