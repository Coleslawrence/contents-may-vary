name: Build Ren'Py web version

# Builds renpy/ into a web game at docs/renpy/, which GitHub Pages serves at
# https://coleslawrence.github.io/contents-may-vary/renpy/
# Everything the build prints is saved to docs/renpy-build-report.txt.
on:
  push:
    branches: [main]
    paths:
      - "renpy/**"
      - ".github/workflows/renpy-web.yml"
  workflow_dispatch:
    inputs:
      renpy_version:
        description: "Ren'Py version to build with (blank = newest that has web support)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: renpy-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENPY_VERSION: ${{ github.event.inputs.renpy_version }}
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p docs
          bash renpy/build-web.sh 2>&1 | tee docs/renpy-build-report.txt
          exit ${PIPESTATUS[0]}

      - name: Publish to GitHub Pages folder
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/renpy-build-report.txt
          [ -d docs/renpy ] && git add -A docs/renpy
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Build Ren'Py web version [skip ci]"
            # If another build committed in the meantime, keep this build's files.
            for i in 1 2 3; do
              git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main && break
              git rebase --abort 2>/dev/null; sleep 5
            done
          fi
